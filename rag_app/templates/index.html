<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local RAG demo</title><style>body{font:16px system-ui;background:#f1f5f4;color:#203137;margin:0;padding:48px 20px}.wrap{max-width:760px;margin:auto}.box{background:white;padding:28px;border:1px solid #dbe5e2;border-radius:16px;margin:18px 0}textarea{width:100%;height:90px;padding:12px;box-sizing:border-box;border:1px solid #cad8d4;border-radius:8px;font:inherit}button{padding:11px 18px;margin-top:10px;background:#137b65;color:white;border:0;border-radius:8px;font-weight:700}pre{white-space:pre-wrap;font:inherit;line-height:1.6}.src{font-size:13px;color:#60736f;border-top:1px solid #e5ecea;padding-top:12px}</style></head><body><main class="wrap"><h1>Ask your documents</h1><p>Retrieval augmented generation using local text files and Ollama.</p><section class="box"><form method="post"><textarea name="question" placeholder="Ask a question about your documents..." required>{{ question }}</textarea><button>Ask</button></form></section>{% if result %}<section class="box"><h2>Answer</h2><pre>{{ result }}</pre><h3>Retrieved sources</h3>{% for name, text in matches %}<p class="src"><b>{{ name }}</b><br>{{ text }}</p>{% endfor %}</section>{% endif %}</main></body></html>
